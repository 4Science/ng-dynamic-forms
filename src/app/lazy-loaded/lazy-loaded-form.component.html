<div class="overflow-hidden content-margin content-padding" style="width: 50%;">

    <form [formGroup]="formGroup">

        <dynamic-bootstrap-form-control *ngFor="let controlModel of formModel" class="d-flex flex-wrap ml-n1 mr-n1"

    </form>

</div>
